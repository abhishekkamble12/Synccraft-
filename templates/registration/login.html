{% extends "base.html" %}

{% block title %}Login — Monach Sync{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 0.5rem; padding: 2rem;">
  <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem; font-weight: 700; text-align: center;">Sign In</h2>

  {% if form.errors %}
    <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #fca5a5; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.85rem; margin-bottom: 1.25rem;">
      Invalid username or password. Please try again.
    </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom: 1.25rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem;">Username</label>
      <input
        type="text"
        name="username"
        required
        autofocus
        style="width: 100%; background: var(--bg-primary); border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.75rem; border-radius: 0.375rem; font-size: 0.95rem; outline: none;"
      >
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem;">Password</label>
      <input
        type="password"
        name="password"
        required
        style="width: 100%; background: var(--bg-primary); border: 1px solid var(--border); color: #fff; padding: 0.6rem 0.75rem; border-radius: 0.375rem; font-size: 0.95rem; outline: none;"
      >
    </div>

    <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 0.65rem;">Log In</button>
  </form>

  <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1.25rem;">
    Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent);">Create one here</a>
  </p>
</div>
{% endblock %}
