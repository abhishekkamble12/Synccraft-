name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: collaborative_sync
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 10
    env:
      DB_ENGINE: ${{ matrix.db == 'postgres' && 'postgresql' || 'sqlite' }}
      DB_HOST: 127.0.0.1
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements-dev.txt
      - name: Migrations are committed and complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Generate shared CRDT test vectors
        run: python -m tests.vectors.generate_vectors
      - name: Python tests
        run: pytest --cov=crdt --cov=documents --cov=ai --cov-report=term-missing
      - name: JavaScript tests (RGA port + sync client)
        run: node --test tests/vectors/test_rga_js.mjs tests/js/test_sync_gaps.mjs

  e2e:
    name: Two-node cluster + load test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Start nginx + 2 Daphne nodes + Postgres + Redis + Celery
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:8080/accounts/login/ && exit 0
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Load test through nginx (fails on divergence or unacked ops)
        run: |
          python -m loadtest.swarm --url http://localhost:8080 --clients 20 --ops 30 \
            | tee loadtest-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-result
          path: loadtest-result.json
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
