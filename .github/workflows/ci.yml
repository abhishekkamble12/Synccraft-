name: CI & Formal Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  python-test:
    name: Python Lint, Typecheck & Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck with Mypy (Strict on crdt/)
        run: |
          mypy crdt/

      - name: Generate Test Vectors
        run: |
          python -m tests.vectors.generate_vectors

      - name: Run Pytest Suite with Coverage & Convergence Proof
        run: |
          pytest --cov=crdt --cov-report=term-missing --cov-report=xml tests/

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  node-test:
    name: JavaScript Port Verification
    runs-on: ubuntu-latest
    needs: python-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python for test vector generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Shared Test Vectors
        run: |
          pip install --upgrade pip
          pip install -e .
          python -m tests.vectors.generate_vectors

      - name: Run Node.js Tests
        run: |
          node --test tests/vectors/test_rga_js.mjs
