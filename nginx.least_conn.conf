# Document-oblivious routing: each WebSocket goes to the least busy node, so one
# document's editors are split across both Daphne nodes. Kept only to benchmark
# against the document-affine routing in nginx.conf:
#
#   NGINX_CONF=./nginx.least_conn.conf docker compose up -d

events {
    worker_connections 2048;
}

http {
    upstream django_cluster {
        least_conn;
        server web_1:8000 max_fails=1 fail_timeout=5s;
        server web_2:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        location /ws/ {
            proxy_pass http://django_cluster;
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://django_cluster;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
