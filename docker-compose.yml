# Two Daphne nodes behind nginx, sharing Postgres (op log, row-lock sequencing)
# and Redis (channel layer fan-out, Celery broker, rate-limit cache).
#
#   docker compose up --build        -> http://localhost:8080

x-app-env: &app-env
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:-local-compose-only-change-me}
  ALLOWED_HOSTS: localhost,127.0.0.1
  CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  SECURE_COOKIES: "False" # plain HTTP on localhost
  SERVE_STATIC: "True"
  DB_ENGINE: postgresql
  DB_HOST: postgres
  DB_NAME: collaborative_sync
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  REDIS_URL: redis://redis:6379/0
  LLM_API_KEY: ${LLM_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}

x-app: &app
  build: .
  environment: *app-env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_1
      - web_2

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: collaborative_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host side defaults to 5433 so a locally installed Postgres on 5432 doesn't clash.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collaborative_sync"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  web_1:
    <<: *app

  web_2:
    <<: *app

  celery_worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2

volumes:
  postgres_data:
