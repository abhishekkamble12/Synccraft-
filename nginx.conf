events {
    worker_connections 2048;
}

http {
    # Document-affine routing ("sharding" by document).
    #
    # Every WebSocket for a document goes to the same Daphne node, picked by a
    # consistent hash of the document id. That node's per-document writer then
    # sees all of the document's edits: its group commit batches across every
    # client, its in-memory replica never has to replay rows written by another
    # node, and the two nodes stop contending for the same Postgres row lock.
    #
    # Correctness does not depend on this. The row lock and the replica catch-up
    # keep any node able to serve any document, so when a node dies nginx simply
    # rehashes its documents onto the survivors (proxy_next_upstream) and clients
    # reconnect there. Consistent hashing means adding a node moves only ~1/N of
    # the documents.
    #
    # nginx.least_conn.conf is the old, document-oblivious routing, kept for
    # benchmarking (NGINX_CONF=./nginx.least_conn.conf docker compose up).
    map $uri $doc_key {
        ~^/ws/docs/(?<doc>[0-9a-fA-F-]+)/  $doc;
        default                            $request_id;
    }

    upstream ws_by_document {
        hash $doc_key consistent;
        server web_1:8000 max_fails=1 fail_timeout=5s;
        server web_2:8000 max_fails=1 fail_timeout=5s;
    }

    upstream http_pool {
        least_conn;
        server web_1:8000 max_fails=1 fail_timeout=5s;
        server web_2:8000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        location /ws/ {
            proxy_pass http://ws_by_document;
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://http_pool;
            proxy_next_upstream error timeout;
            proxy_connect_timeout 2s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
